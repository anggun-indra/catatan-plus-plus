<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Squircle Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Notepad Sheet Gradient -->
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Fold Gradient -->
    <linearGradient id="foldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Plus Plus Accent Gradient (Neon Emerald to Cyan) -->
    <linearGradient id="plusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#00bbf9"/>
      <stop offset="100%" stop-color="#4361ee"/>
    </linearGradient>

    <!-- Chameleon Crest Gradient -->
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowSquircle" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="shadowPad" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="glowPlus" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00f5d4" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 1. Apple-style Squircle Canvas Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104"
        fill="url(#bgGrad)"
        stroke="url(#borderGrad)"
        stroke-width="3"
        filter="url(#shadowSquircle)"/>

  <!-- Subtle Inner Ambient Mesh Light -->
  <circle cx="120" cy="110" r="160" fill="#38bdf8" opacity="0.08" filter="blur(40px)"/>
  <circle cx="380" cy="390" r="140" fill="#10b981" opacity="0.08" filter="blur(40px)"/>

  <!-- 2. Main Notepad Sheet (White crisp sheet with rounded corners) -->
  <g filter="url(#shadowPad)">
    <!-- Sheet Body with Cutout/Fold at Top-Right -->
    <path d="M 124 104
             L 320 104
             L 388 172
             L 388 408
             A 20 20 0 0 1 368 428
             L 144 428
             A 20 20 0 0 1 124 408
             Z"
          fill="url(#padGrad)"/>

    <!-- Folded Corner Geometry -->
    <path d="M 320 104
             L 320 156
             A 16 16 0 0 0 336 172
             L 388 172
             Z"
          fill="url(#foldGrad)"/>
    <path d="M 320 104
             L 388 172
             Z"
          stroke="#94a3b8" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- 3. Notepad Header Accent Bar / Chameleon Crest Band -->
  <path d="M 124 124
           A 20 20 0 0 1 144 104
           L 320 104
           L 320 128
           L 124 128
           Z"
        fill="url(#crestGrad)"/>

  <!-- 4. Syntax Highlighting Lines (Representation of Code/Editor) -->
  <g opacity="0.9">
    <!-- Line 1: Keyword + Identifier (Emerald + Navy) -->
    <rect x="156" y="156" width="44" height="10" rx="5" fill="#10b981"/>
    <rect x="208" y="156" width="70" height="10" rx="5" fill="#334155"/>

    <!-- Line 2: Indented Statement (Indigo + Amber) -->
    <rect x="180" y="180" width="56" height="10" rx="5" fill="#6366f1"/>
    <rect x="244" y="180" width="80" height="10" rx="5" fill="#f59e0b"/>

    <!-- Line 3: Indented Variable + String (Cyan + Rose) -->
    <rect x="180" y="204" width="72" height="10" rx="5" fill="#06b6d4"/>
    <rect x="260" y="204" width="60" height="10" rx="5" fill="#f43f5e"/>

    <!-- Line 4: Closing Bracket -->
    <rect x="156" y="228" width="24" height="10" rx="5" fill="#64748b"/>

    <!-- Line 5: Comment Line (Slate Muted) -->
    <rect x="156" y="256" width="120" height="8" rx="4" fill="#94a3b8" opacity="0.7"/>

    <!-- Line 6: Another Code Block -->
    <rect x="156" y="280" width="50" height="10" rx="5" fill="#8b5cf6"/>
    <rect x="214" y="280" width="45" height="10" rx="5" fill="#3b82f6"/>
  </g>

  <!-- 5. Stylized Chameleon Tail Motif (Whimsical nod to Notepad++) -->
  <path d="M 160 384
           C 160 350, 195 340, 215 355
           C 230 366, 225 390, 205 394
           C 192 396, 184 386, 190 376
           C 194 370, 202 372, 200 376"
        fill="none"
        stroke="url(#crestGrad)"
        stroke-width="5"
        stroke-linecap="round"
        opacity="0.85"/>

  <!-- 6. Bold Modern "++" Emblem (Bottom-Right Floating Badge) -->
  <g filter="url(#glowPlus)">
    <!-- Circular Shield Background for ++ -->
    <circle cx="346" cy="346" r="62" fill="#0f172a" stroke="#1e293b" stroke-width="3"/>

    <!-- Plus 1 (Left) -->
    <g transform="translate(322, 346)">
      <!-- Vertical bar -->
      <rect x="-4.5" y="-18" width="9" height="36" rx="4.5" fill="url(#plusGrad)"/>
      <!-- Horizontal bar -->
      <rect x="-18" y="-4.5" width="36" height="9" rx="4.5" fill="url(#plusGrad)"/>
    </g>

    <!-- Plus 2 (Right, slightly elevated) -->
    <g transform="translate(366, 346)">
      <!-- Vertical bar -->
      <rect x="-4.5" y="-18" width="9" height="36" rx="4.5" fill="url(#plusGrad)"/>
      <!-- Horizontal bar -->
      <rect x="-18" y="-4.5" width="36" height="9" rx="4.5" fill="url(#plusGrad)"/>
    </g>
  </g>

  <!-- 7. Tiny Sparkle/Star Accents -->
  <circle cx="304" cy="296" r="3" fill="#00f5d4" opacity="0.8"/>
  <circle cx="410" cy="386" r="2.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="388" cy="276" r="2" fill="#ffffff" opacity="0.6"/>
</svg>
