name: Build & Release Catatan++

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test on Apple Silicon
    runs-on: macos-14 # Native Apple Silicon (M-series) runner
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Catatan++
        run: |
          cd macport
          chmod +x build.sh
          ./build.sh

      - name: Run Self-Tests
        run: |
          macport/dist/Catatan++.app/Contents/MacOS/Catatan++ --selftest

      - name: Package DMG & ZIP (Release Only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME}"
          echo "Packaging version: ${VERSION}"
          
          # 1. Create compressed ZIP archive
          cd macport/dist
          ditto -c -k --keepParent "Catatan++.app" "Catatan++-${VERSION}-macOS-arm64.zip"
          
          # 2. Create drag-and-drop DMG Installer
          mkdir -p /tmp/CatatanDMG
          cp -R "Catatan++.app" /tmp/CatatanDMG/
          ln -s /Applications /tmp/CatatanDMG/Applications
          
          hdiutil create -volname "Catatan++" \
            -srcfolder /tmp/CatatanDMG \
            -ov -format UDZO \
            "Catatan++-${VERSION}-Installer.dmg"
          
          rm -rf /tmp/CatatanDMG
          ls -lh

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Catatan++ ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            macport/dist/Catatan++-*-Installer.dmg
            macport/dist/Catatan++-*-macOS-arm64.zip
