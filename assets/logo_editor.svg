<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- macOS Squircle Tile Gradient: Vibrant Emerald Jade -->
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Top Highlight Glow -->
    <linearGradient id="topHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="12%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="85%" stop-color="#000000" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Apple-style Soft Drop Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#022c22" flood-opacity="0.40"/>
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#022c22" flood-opacity="0.20"/>
    </filter>

    <filter id="foldShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-4" dy="4" stdDeviation="4" flood-color="#047857" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- 1. The Full-Bleed Squircle Box (The Tile) -->
  <rect x="32" y="32" width="448" height="448" rx="102" ry="102" fill="url(#tileGrad)"/>
  <rect x="32" y="32" width="448" height="448" rx="102" ry="102" fill="url(#topHighlight)"/>
  <!-- Rim highlight -->
  <rect x="33" y="33" width="446" height="446" rx="101" ry="101" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.28"/>

  <!-- 2. Central Editor Glyph (Wide, Solid White, Fitted Proportions) -->
  <g filter="url(#dropShadow)">
    <!-- Document Silhouette: 312px wide, 332px tall, beautifully proportioned -->
    <path d="M 128 108
             L 332 108
             L 412 188
             L 412 396
             A 28 28 0 0 1 384 424
             L 156 424
             A 28 28 0 0 1 128 396
             Z"
          fill="#ffffff"/>

    <!-- Folded Corner Flap -->
    <path d="M 332 108
             L 332 164
             A 24 24 0 0 0 356 188
             L 412 188
             Z"
          fill="#e2e8f0"
          filter="url(#foldShadow)"/>

    <!-- Negative Space Code Syntax Lines (Emerald showing through) -->
    <!-- Header line with tag badge -->
    <rect x="168" y="156" width="120" height="16" rx="8" fill="url(#tileGrad)"/>
    
    <!-- Code Line 1 -->
    <rect x="168" y="192" width="200" height="12" rx="6" fill="url(#tileGrad)"/>

    <!-- Code Line 2 (Indented) -->
    <rect x="200" y="218" width="150" height="12" rx="6" fill="url(#tileGrad)"/>

    <!-- Code Line 3 (Indented) -->
    <rect x="200" y="244" width="110" height="12" rx="6" fill="url(#tileGrad)"/>

    <!-- Large Bold ++ Pill at the bottom -->
    <rect x="168" y="286" width="204" height="96" rx="24" fill="url(#tileGrad)"/>

    <!-- First Plus in White -->
    <g transform="translate(232, 334)">
      <rect x="-7" y="-26" width="14" height="52" rx="7" fill="#ffffff"/>
      <rect x="-26" y="-7" width="52" height="14" rx="7" fill="#ffffff"/>
    </g>

    <!-- Second Plus in White -->
    <g transform="translate(308, 334)">
      <rect x="-7" y="-26" width="14" height="52" rx="7" fill="#ffffff"/>
      <rect x="-26" y="-7" width="52" height="14" rx="7" fill="#ffffff"/>
    </g>
  </g>
</svg>