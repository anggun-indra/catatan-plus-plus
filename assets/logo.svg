<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- macOS Squircle Tile Gradient: Vibrant Emerald Jade -->
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Top Highlight Glow (macOS Big Sur+ aesthetic) -->
    <linearGradient id="topHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="12%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="85%" stop-color="#000000" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Apple-style Soft Drop Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#022c22" flood-opacity="0.42"/>
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#022c22" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- 1. The Full-Bleed Squircle Box (The Tile) -->
  <rect x="32" y="32" width="448" height="448" rx="102" ry="102" fill="url(#tileGrad)"/>
  <rect x="32" y="32" width="448" height="448" rx="102" ry="102" fill="url(#topHighlight)"/>
  <!-- Rim highlight -->
  <rect x="33" y="33" width="446" height="446" rx="101" ry="101" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.28"/>

  <!-- 2. The Central Glyph (Clean, Bold, Solid White Silhouette) -->
  <g filter="url(#dropShadow)">
    <!-- Stylus / Pencil Perch -->
    <path d="M 120 354
             L 370 354
             L 395 363
             L 370 372
             L 120 372
             A 9 9 0 0 1 120 354
             Z"
          fill="#ffffff" fill-opacity="0.95"/>
    <!-- Pencil Lead Cutout (Emerald showing through) -->
    <polygon points="388,363 395,363 388,361 388,365" fill="url(#tileGrad)"/>

    <!-- Chameleon Main Silhouette -->
    <path d="M 148 354
             C 112 354, 84 330, 84 290
             C 84 252, 114 226, 150 226
             C 172 226, 188 238, 196 254
             C 200 266, 194 276, 182 276
             C 172 276, 166 266, 154 266
             C 140 266, 130 276, 130 290
             C 130 304, 142 314, 158 314
             C 184 314, 208 292, 230 268
             C 252 244, 280 228, 316 228
             C 334 228, 348 218, 360 202
             C 370 190, 384 188, 398 198
             C 418 214, 428 236, 428 264
             C 428 296, 406 322, 376 336
             C 356 346, 332 354, 304 354
             Z"
          fill="#ffffff"/>

    <!-- Front & Back Claws gripping the pencil -->
    <path d="M 232 344 L 244 362 L 256 362 L 246 344 Z" fill="#ffffff"/>
    <path d="M 334 344 L 346 362 L 358 362 L 348 344 Z" fill="#ffffff"/>

    <!-- Eye: Large Chameleon Orbit with Emerald Pupil and White Reflection -->
    <circle cx="384" cy="250" r="22" fill="url(#tileGrad)"/>
    <circle cx="387" cy="247" r="9" fill="#ffffff"/>

    <!-- Plus Plus ++ on the Back (Bold, iconic, Docker container style) -->
    <!-- First Plus -->
    <g transform="translate(258, 178)">
      <rect x="-8" y="-30" width="16" height="60" rx="8" fill="#ffffff"/>
      <rect x="-30" y="-8" width="60" height="16" rx="8" fill="#ffffff"/>
    </g>

    <!-- Second Plus -->
    <g transform="translate(324, 178)">
      <rect x="-8" y="-30" width="16" height="60" rx="8" fill="#ffffff"/>
      <rect x="-30" y="-8" width="60" height="16" rx="8" fill="#ffffff"/>
    </g>
  </g>
</svg>